<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DEV_NOTE v3.0 — مدير أكواد المطور</title>
<meta name="description" content="مدير أكواد ومشاريع للمطورين مع تسجيل دخول Google وحفظ سحابي لكل مستخدم." />
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --input:#21262d; --code:#05070a; --text:#c9d1d9;
  --muted:#6e7681; --border:#30363d; --accent:#00ff66; --danger:#ff7b72; --blue:#58a6ff;
}
body[data-theme="dracula"]{
  --bg:#282a36; --panel:#1e1f2b; --input:#363847; --code:#1a1b26; --text:#f8f8f2;
  --muted:#8b8d9b; --border:#44475a; --accent:#bd93f9; --danger:#ff5555; --blue:#8be9fd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Courier New",monospace;background:var(--bg);color:var(--text);min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100vh}
.sidebar{width:340px;min-width:340px;background:var(--panel);border-left:2px solid var(--border);padding:14px;display:flex;flex-direction:column;overflow:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px;background:var(--bg)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand h1{font-size:1.05rem;color:var(--accent)}
button,.btn{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;transition:.2s}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
.primary{width:100%;border-color:var(--accent);color:var(--accent);font-weight:bold}
.primary:hover{background:var(--accent);color:var(--bg)}
.form input,.form textarea,.form select,.search{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px;margin-bottom:8px;outline:none}
.form input:focus,.form textarea:focus,.form select:focus,.search:focus{border-color:var(--accent)}
.form textarea{resize:vertical;min-height:80px}
.search{margin-top:10px}
.filters{display:flex;gap:6px;margin:7px 0;overflow:auto}
.filter{white-space:nowrap;font-size:.72rem}
.filter.active{border-color:var(--accent);color:var(--accent)}
.notes{flex:1;overflow:auto;margin-top:5px}
.note{border:1px solid var(--border);background:var(--input);border-radius:7px;padding:9px;margin-bottom:7px;display:flex;gap:8px;align-items:center}
.note.active{border-color:var(--accent)}
.note.pinned{box-shadow:inset -3px 0 var(--accent)}
.note-main{min-width:0;flex:1;cursor:pointer}
.note-title{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-meta{font-size:.68rem;color:var(--muted);margin-top:5px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.badge{font-size:.65rem;padding:2px 5px;border-radius:4px;background:var(--border);color:var(--blue)}
.icon{border:0;padding:3px;background:transparent}
.icon.fav{color:#ffd33d}
.icon.pin{color:var(--accent)}
.stats{border-top:1px solid var(--border);padding-top:9px;margin-top:8px;font-size:.7rem;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stats b{color:var(--accent)}
.backup{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:11px;margin-bottom:10px}
.title-area{display:flex;align-items:center;gap:8px;min-width:0}
.view-title{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{color:var(--accent);font-size:.75rem}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.editor-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tool{font-size:.72rem}
.code-wrap{flex:1;min-height:0;background:var(--code);border:1px solid var(--border);border-radius:8px;overflow:auto;display:flex}
.line-nos{padding:14px 9px;text-align:right;color:#4b5563;border-left:1px solid var(--border);user-select:none;line-height:1.6;font-size:var(--code-size,.88rem)}
.code-box{padding:14px;min-width:0;flex:1;overflow:auto}
.code-display{margin:0;color:#e6edf3;font-size:var(--code-size,.88rem);line-height:1.6;white-space:pre;tab-size:4}
.code-edit{width:100%;height:100%;min-height:300px;background:transparent;border:0;outline:0;color:#e6edf3;resize:none;font-size:var(--code-size,.88rem);line-height:1.6;white-space:pre;tab-size:4}
.wrap .code-display,.wrap .code-edit{white-space:pre-wrap;overflow-wrap:anywhere}
.hl-key{color:#ff7b72}.hl-str{color:#a5d6ff}.hl-num{color:#79c0ff}
.hl-com{color:#8b949e;font-style:italic}.hl-fn{color:#d2a8ff}.hl-tag{color:#7ee787}
.modal-bg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:15px}
.modal h2{color:var(--accent);margin-bottom:10px;font-size:1rem}
.modal textarea,.modal input,.modal select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px;margin-bottom:8px;outline:0}
.modal textarea{min-height:300px}
.palette-item{padding:10px;border:1px solid transparent;border-radius:6px;cursor:pointer}
.palette-item:hover{border-color:var(--accent);color:var(--accent)}
.preview{width:100%;height:65vh;background:#fff;border:0;border-radius:6px}
.empty{padding:25px;text-align:center;color:var(--muted);font-size:.8rem}
.toast{position:fixed;bottom:18px;left:18px;background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:10px 14px;border-radius:7px;z-index:50}
.version{border:1px solid var(--border);padding:8px;border-radius:6px;margin-bottom:6px}
.version small{color:var(--muted)}
.mobile-menu{display:none}
.account{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--input);border-radius:8px;padding:7px;margin-bottom:12px}
.account img{width:34px;height:34px;border-radius:50%;border:1px solid var(--accent)}
.account .who{min-width:0;flex:1}
.account .name{font-size:.78rem;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account .mail{font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:26px;text-align:center}
.login-card h1{color:var(--accent);font-size:1.3rem;margin-bottom:8px}
.login-card p{color:var(--muted);font-size:.8rem;line-height:1.7;margin-bottom:20px}
.google-btn{width:100%;border-color:var(--accent);color:var(--accent);font-weight:bold;padding:12px;font-size:.92rem}
.google-btn:hover{background:var(--accent);color:var(--bg)}
.login-err{color:var(--danger);font-size:.75rem;margin-top:12px}
@media (max-width:768px){
  .app{display:block;height:auto}
  .sidebar{width:100%;min-width:0;border-left:0;border-bottom:2px solid var(--border)}
  .main{height:calc(100vh - 20px);min-height:560px;padding:12px}
  .header{align-items:flex-start}
  .actions{justify-content:flex-start}
  .mobile-menu{display:block}
}
</style>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div id="loginView" class="login" style="display:none">
  <div class="login-card">
    <h1>// DEV_NOTE v3.0</h1>
    <p>مدير أكواد المطور. سجّل الدخول بحساب Google لتصبح كل مشاريعك محفوظة في حسابك الخاص ومتاحة على الهاتف والكمبيوتر.</p>
    <button class="google-btn" id="googleBtn">🔐 تسجيل الدخول باستخدام Google</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="bootView" class="login">
  <div class="login-card"><h1>// DEV_NOTE v3.0</h1><p>جارٍ التحقق من الجلسة...</p></div>
</div>

<!-- ===== التطبيق ===== -->
<div id="appView" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>// DEV_NOTE v3.0</h1>
      <button id="themeBtn">🌙</button>
    </div>

    <div class="account">
      <img id="uAvatar" alt="" referrerpolicy="no-referrer" style="display:none" />
      <div class="who"><div class="name" id="uName"></div><div class="mail" id="uMail"></div></div>
      <button id="signOutBtn" title="تسجيل الخروج">🚪 خروج</button>
    </div>

    <div class="form">
      <input id="title" placeholder="اسم المشروع..." />
      <input id="desc" placeholder="وصف المشروع (اختياري)..." />
      <select id="type"></select>
      <input id="tags" placeholder="وسوم: لعبة, api, frontend" />
      <textarea id="codeInput" placeholder="ضع الكود هنا..."></textarea>
      <button class="primary" id="saveBtn">[+] حفظ المشروع</button>
    </div>

    <input class="search" id="search" placeholder="🔍 ابحث في الاسم أو الوسوم أو الكود..." />
    <div class="filters" id="filters"></div>
    <div class="notes" id="notesList"></div>

    <div class="stats" id="stats"></div>

    <div class="backup">
      <button id="expJson">📤 JSON</button>
      <button id="impBtn">📥 استيراد</button>
      <button id="expAll">📦 تصدير الكل</button>
      <button id="settingsBtn">⚙️ إعدادات</button>
      <input type="file" accept=".json" hidden id="fileInput" />
    </div>
  </aside>

  <main class="main">
    <div class="header">
      <div class="title-area">
        <button class="mobile-menu" id="menuBtn">☰</button>
        <button id="backBtn" style="display:none">←</button>
        <h2 class="view-title" id="viewTitle">اختر مشروعًا</h2>
        <span class="tag" id="viewType"></span>
      </div>
      <div class="actions">
        <button id="editBtn" style="display:none">✏️ تعديل</button>
        <button id="copyBtn">📋 نسخ</button>
        <button id="shareBtn">🔗 مشاركة</button>
      </div>
    </div>

    <div class="editor-tools">
      <button class="tool" id="fontDown">A−</button>
      <button class="tool" id="fontUp">A+</button>
      <button class="tool" id="wrapBtn">↔️ التفاف: OFF</button>
      <button class="tool" id="fsBtn">⛶ ملء الشاشة</button>
      <button class="tool" id="previewBtn" style="display:none">▶️ تشغيل Preview</button>
      <button class="tool" id="versionsBtn" style="display:none">🕒 الإصدارات</button>
    </div>

    <div class="code-wrap" id="codeWrap">
      <div class="line-nos" id="lineNos"><div>1</div></div>
      <div class="code-box" id="codeBox">
        <pre class="code-display">// أضف مشروعًا من القائمة الجانبية.</pre>
      </div>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
/* =========================================================================
   إعدادات الاتصال بالسحابة (Lovable Cloud / Supabase)
   إن أردت استخدام مشروعك الخاص، غيّر هاتين القيمتين فقط:
   ========================================================================= */
const SUPABASE_URL = "https://gliaiartmtkbcsnnzhwo.supabase.co";
const SUPABASE_KEY = "sb_publishable_sIzjDEIaOEDYhD_qgBGZnA_tgtdZbjL";
/* ملاحظة: هذا المفتاح عام (publishable) ومصمّم للاستخدام في المتصفح.
   الحماية الحقيقية تأتي من سياسات RLS في قاعدة البيانات:
   كل مستخدم يرى ويعدّل صفوفه فقط (user_id = auth.uid()).

   جدول قاعدة البيانات المطلوب (منفَّذ مسبقًا في مشروعك):
   create table public.projects(
     id uuid primary key default gen_random_uuid(),
     user_id uuid not null references auth.users(id) on delete cascade,
     title text not null, description text default '', type text default 'Other',
     code text default '', tags text[] default '{}',
     favorite boolean default false, pinned boolean default false,
     versions jsonb default '[]'::jsonb,
     created_at timestamptz default now(), updated_at timestamptz default now());
   grant select, insert, update, delete on public.projects to authenticated;
   alter table public.projects enable row level security;
   create policy "own" on public.projects for all to authenticated
     using (auth.uid() = user_id) with check (auth.uid() = user_id);
*/

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* ---------------- أدوات ---------------- */
const $ = (id) => document.getElementById(id);
const TYPES = ["HTML / JS","CSS","C++ / GML","Python","JavaScript","TypeScript","JSON","SQL","Other"];

function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function highlight(code,type){
  let x=esc(code);
  if(/HTML/i.test(type)) x=x.replace(/(&lt;\/?)([\w-]+)([^&]*?)(\/?>)/g,'<span class="hl-tag">$1$2$3$4</span>');
  x=x.replace(/(\/\/.*|#.*|\/\*[\s\S]*?\*\/)/g,'<span class="hl-com">$1</span>');
  x=x.replace(/(["'`])(?:\\.|(?!\1).)*?\1/g,'<span class="hl-str">$&</span>');
  const kw=/Python/i.test(type)
    ? "and|as|assert|break|class|def|elif|else|for|from|if|import|in|is|lambda|not|or|pass|return|try|while|with|yield"
    : "const|let|var|function|return|if|else|for|while|class|new|import|from|export|async|await|true|false|null|undefined|public|private|void|int|float|bool|using|namespace|SELECT|FROM|WHERE|INSERT|UPDATE|DELETE";
  x=x.replace(new RegExp("\\b("+kw+")\\b","g"),'<span class="hl-key">$1</span>');
  x=x.replace(/\b\d+(?:\.\d+)?\b/g,'<span class="hl-num">$&</span>');
  x=x.replace(/\b([A-Za-z_$][\w$]*)\s*(?=\()/g,'<span class="hl-fn">$1</span>');
  return x;
}
function download(name,data,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function toast(t){
  const d=document.createElement("div");d.className="toast";d.textContent=t;
  $("toastRoot").appendChild(d);setTimeout(()=>d.remove(),1800);
}
function closeModal(){ $("modalRoot").innerHTML=""; }
function openModal(html){
  $("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;
  $("modalRoot").querySelector(".modal-bg").addEventListener("click",(e)=>{ if(e.target===e.currentTarget) closeModal(); });
}

/* ---------------- الحالة ---------------- */
let user=null, notes=[], activeId=null, isEditing=false, draft="";
let filter="all", wrapOn=false;
let theme=localStorage.getItem("devTheme")||"matrix";
let fontSize=+(localStorage.getItem("devFont")||0.88);

function applyPrefs(){
  document.body.dataset.theme = theme==="dracula" ? "dracula" : "";
  document.body.style.setProperty("--code-size", fontSize+"rem");
  $("themeBtn").textContent = theme==="dracula" ? "💚" : "🌙";
}

/* ---------------- المصادقة ---------------- */
$("googleBtn").addEventListener("click", async ()=>{
  $("googleBtn").disabled=true; $("googleBtn").textContent="جارٍ التحويل...";
  const { error } = await supabase.auth.signInWithOAuth({
    provider:"google",
    options:{ redirectTo: window.location.origin + window.location.pathname }
  });
  if(error){
    $("loginErr").textContent="تعذر تسجيل الدخول. حاول مرة أخرى.";
    $("googleBtn").disabled=false; $("googleBtn").textContent="🔐 تسجيل الدخول باستخدام Google";
  }
});
$("signOutBtn").addEventListener("click", ()=>supabase.auth.signOut());

supabase.auth.onAuthStateChange((_e,session)=>render(session));
supabase.auth.getSession().then(({data})=>render(data.session));

async function render(session){
  $("bootView").style.display="none";
  if(!session){
    user=null; notes=[];
    $("loginView").style.display="flex"; $("appView").style.display="none";
    return;
  }
  user=session.user;
  $("loginView").style.display="none";
  $("appView").style.display="";
  const m=user.user_metadata||{};
  const av=m.avatar_url||m.picture||"";
  if(av){ $("uAvatar").src=av; $("uAvatar").style.display=""; }
  $("uName").textContent=m.full_name||m.name||user.email||"مستخدم";
  $("uMail").textContent=user.email||"";
  applyPrefs();
  await loadNotes();
}

/* ---------------- CRUD ---------------- */
async function loadNotes(){
  const {data,error}=await supabase.from("projects").select("*")
    .order("pinned",{ascending:false}).order("updated_at",{ascending:false});
  if(error) return toast("خطأ في التحميل: "+error.message);
  notes=(data||[]).map(n=>({...n,tags:n.tags||[],versions:n.versions||[]}));
  renderList(); renderMain();
}

async function saveCode(){
  const t=$("title").value.trim(), c=$("codeInput").value;
  if(!t||!c.trim()) return alert("أدخل اسم المشروع والكود.");
  const {data,error}=await supabase.from("projects").insert({
    user_id:user.id, title:t, description:$("desc").value.trim(), type:$("type").value, code:c,
    tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean)
  }).select().single();
  if(error) return toast("خطأ: "+error.message);
  notes.unshift({...data,tags:data.tags||[],versions:data.versions||[]});
  $("title").value=$("desc").value=$("tags").value=$("codeInput").value="";
  activeId=data.id; isEditing=false;
  renderList(); renderMain(); toast("تم حفظ المشروع ✅");
}

async function patch(id,fields){
  const n=notes.find(x=>x.id===id); if(!n) return;
  Object.assign(n,fields,{updated_at:new Date().toISOString()});
  renderList(); renderMain();
  const {error}=await supabase.from("projects").update(fields).eq("id",id);
  if(error) toast("خطأ: "+error.message);
}

async function deleteCode(id){
  if(!confirm("حذف المشروع؟")) return;
  notes=notes.filter(n=>n.id!==id);
  if(activeId===id){activeId=null;isEditing=false;}
  renderList(); renderMain();
  const {error}=await supabase.from("projects").delete().eq("id",id);
  if(error) return toast("خطأ: "+error.message);
  toast("تم الحذف");
}

const active=()=>notes.find(n=>n.id===activeId)||null;

function toggleEdit(){
  const n=active(); if(!n) return;
  if(isEditing){
    const box=$("codeBox").querySelector(".code-edit");
    draft=box?box.value:draft;
    const versions = n.code!==draft ? [{code:n.code,date:Date.parse(n.updated_at)},...n.versions] : n.versions;
    patch(n.id,{code:draft,versions});
    isEditing=false; renderMain(); toast("تم حفظ التعديل 💾"); return;
  }
  draft=n.code; isEditing=true; renderMain();
}

function restoreVersion(i){
  const n=active(); if(!n) return;
  const v=n.versions[i];
  patch(n.id,{code:v.code,versions:[{code:n.code,date:Date.now()},...n.versions]});
  closeModal(); toast("تمت الاستعادة");
}

/* ---------------- العرض ---------------- */
function visibleNotes(){
  const q=$("search").value.trim().toLowerCase();
  return notes.filter(n=>
    (filter==="all"||(filter==="fav"&&n.favorite)||(filter==="pin"&&n.pinned)||n.tags.includes(filter)) &&
    (!q||(n.title+" "+n.type+" "+n.description+" "+n.tags.join(" ")+" "+n.code).toLowerCase().includes(q))
  ).sort((a,b)=>(b.pinned-a.pinned)||(Date.parse(b.updated_at)-Date.parse(a.updated_at)));
}

function renderFilters(){
  const allTags=[...new Set(notes.flatMap(n=>n.tags))].slice(0,20);
  const btn=(k,l)=>`<button class="filter ${filter===k?"active":""}" data-f="${esc(k)}">${esc(l)}</button>`;
  $("filters").innerHTML=btn("all","الكل")+btn("fav","⭐ المفضلة")+btn("pin","📌 المثبتة")+allTags.map(t=>btn(t,"#"+t)).join("");
  $("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderList();});
}

function renderStats(){
  const counts={}; notes.forEach(n=>counts[n.type]=(counts[n.type]||0)+1);
  const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]||"—";
  const last=notes.length?new Date(Math.max(...notes.map(n=>Date.parse(n.updated_at)))).toLocaleDateString("ar-TN"):"—";
  $("stats").innerHTML=`
    <div>المشاريع: <b>${notes.length}</b></div>
    <div>الأسطر: <b>${notes.reduce((s,n)=>s+(n.code?n.code.split("\n").length:0),0)}</b></div>
    <div>المفضلة: <b>${notes.filter(n=>n.favorite).length}</b></div>
    <div>المثبتة: <b>${notes.filter(n=>n.pinned).length}</b></div>
    <div>الأكثر استخدامًا: <b>${esc(top)}</b></div>
    <div>آخر تعديل: <b>${last}</b></div>`;
}

function renderList(){
  renderFilters(); renderStats();
  const list=visibleNotes();
  $("notesList").innerHTML = list.length ? list.map(n=>`
    <div class="note ${n.id===activeId?"active":""} ${n.pinned?"pinned":""}">
      <div class="note-main" data-open="${esc(n.id)}">
        <div class="note-title">${esc(n.title)}</div>
        <div class="badges"><span class="badge">${esc(n.type)}</span>${n.tags.slice(0,3).map(t=>`<span class="badge">#${esc(t)}</span>`).join("")}</div>
        <div class="note-meta">${new Date(n.updated_at).toLocaleString("ar-TN")}</div>
      </div>
      <button class="icon fav" data-fav="${esc(n.id)}">${n.favorite?"★":"☆"}</button>
      <button class="icon pin" data-pin="${esc(n.id)}">${n.pinned?"📌":"📍"}</button>
      <button class="icon" data-del="${esc(n.id)}">🗑️</button>
    </div>`).join("") : `<div class="empty">لا توجد نتائج.</div>`;

  $("notesList").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{activeId=el.dataset.open;isEditing=false;renderList();renderMain();});
  $("notesList").querySelectorAll("[data-fav]").forEach(el=>el.onclick=()=>{const n=notes.find(x=>x.id===el.dataset.fav);patch(n.id,{favorite:!n.favorite});});
  $("notesList").querySelectorAll("[data-pin]").forEach(el=>el.onclick=()=>{const n=notes.find(x=>x.id===el.dataset.pin);patch(n.id,{pinned:!n.pinned});});
  $("notesList").querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>deleteCode(el.dataset.del));
}

function renderMain(){
  const n=active();
  $("viewTitle").textContent = n ? ">_ "+n.title : "اختر مشروعًا";
  $("viewType").textContent = n ? "["+n.type+"]" : "";
  $("backBtn").style.display = n ? "" : "none";
  $("editBtn").style.display = n ? "" : "none";
  $("editBtn").textContent = isEditing ? "💾 حفظ" : "✏️ تعديل";
  $("versionsBtn").style.display = n ? "" : "none";
  $("previewBtn").style.display = (n && /HTML|JavaScript|JS/i.test(n.type)) ? "" : "none";
  $("codeWrap").className = "code-wrap"+(wrapOn?" wrap":"");

  const text = n ? (isEditing?draft:n.code) : "// أضف مشروعًا من القائمة الجانبية.";
  $("codeBox").innerHTML = n && isEditing
    ? `<textarea class="code-edit"></textarea>`
    : `<pre class="code-display">${n?highlight(n.code,n.type):esc(text)}</pre>`;
  if(n&&isEditing){
    const ta=$("codeBox").querySelector(".code-edit");
    ta.value=draft; ta.oninput=()=>{draft=ta.value;renderLineNos(draft);};
  }
  renderLineNos(text);
}
function renderLineNos(text){
  const c=text.split("\n").length;
  $("lineNos").innerHTML=Array.from({length:c},(_,i)=>`<div>${i+1}</div>`).join("");
}

/* ---------------- الأدوات ---------------- */
function copyCode(){
  const n=active(); if(!n) return;
  navigator.clipboard?.writeText(n.code).then(()=>toast("تم النسخ 📋")).catch(()=>alert("تعذر النسخ تلقائيًا."));
}
async function shareCode(){
  const n=active(); if(!n) return;
  const text=`${n.title}\n\n${n.code}`;
  if(navigator.share){ try{ await navigator.share({title:n.title,text}); }catch{} }
  else { await navigator.clipboard.writeText(text); toast("تم نسخ النص للمشاركة"); }
}
function changeFont(v){
  fontSize=Math.min(1.5,Math.max(0.6,fontSize+v*0.08));
  localStorage.setItem("devFont",String(fontSize)); applyPrefs();
}
function toggleTheme(){
  theme = theme==="dracula" ? "matrix" : "dracula";
  localStorage.setItem("devTheme",theme); applyPrefs();
}
function runPreview(){
  const n=active(); if(!n) return;
  let src=n.code;
  if(!/<html/i.test(src)) src=`<!doctype html><html><head><meta charset="utf-8"></head><body><script>${src.replace(/<\/script/gi,"<\\/script")}<\/script></body></html>`;
  openModal(`<h2>▶️ Preview</h2><iframe class="preview" sandbox="allow-scripts"></iframe><br><button data-x>إغلاق</button>`);
  $("modalRoot").querySelector("iframe").srcdoc=src;
  $("modalRoot").querySelector("[data-x]").onclick=closeModal;
}
function openVersions(){
  const n=active(); if(!n) return;
  const body = n.versions.length ? n.versions.map((v,i)=>`
    <div class="version"><b>الإصدار السابق #${i+1}</b><br><small>${new Date(v.date).toLocaleString("ar-TN")}</small><br>
    <button data-r="${i}">استعادة</button> <button data-v="${i}">عرض</button></div>`).join("")
    : `<div class="empty">لا توجد إصدارات سابقة.</div>`;
  openModal(`<h2>🕒 سجل الإصدارات</h2>${body}<button data-x>إغلاق</button>`);
  const r=$("modalRoot");
  r.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>restoreVersion(+b.dataset.r));
  r.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    openModal(`<h2>الإصدار السابق</h2><textarea readonly>${esc(n.versions[+b.dataset.v].code)}</textarea><button data-b>رجوع</button> <button data-x>إغلاق</button>`);
    $("modalRoot").querySelector("[data-b]").onclick=openVersions;
    $("modalRoot").querySelector("[data-x]").onclick=closeModal;
  });
  r.querySelector("[data-x]").onclick=closeModal;
}
function openSettings(){
  openModal(`<h2>⚙️ إعدادات</h2>
    <p style="margin-bottom:10px">الثيم</p><button data-t>تغيير الثيم</button><br><br>
    <p style="margin-bottom:10px">الحساب: ${esc(user?.email||"")}</p><button data-o>🚪 تسجيل الخروج</button><br><br>
    <p style="margin-bottom:10px">مسح كل بيانات حسابك</p>
    <button data-c style="color:var(--danger)">🗑️ حذف كل المشاريع</button><br><br><button data-x>إغلاق</button>`);
  const r=$("modalRoot");
  r.querySelector("[data-t]").onclick=()=>{toggleTheme();closeModal();};
  r.querySelector("[data-o]").onclick=()=>supabase.auth.signOut();
  r.querySelector("[data-c]").onclick=clearAll;
  r.querySelector("[data-x]").onclick=closeModal;
}
async function clearAll(){
  if(!confirm("سيتم حذف جميع مشاريعك نهائيًا. متابعة؟")) return;
  const {error}=await supabase.from("projects").delete().eq("user_id",user.id);
  if(error) return toast("خطأ: "+error.message);
  notes=[];activeId=null;isEditing=false;closeModal();renderList();renderMain();toast("تم حذف البيانات");
}
function exportJSON(){ if(!notes.length) return alert("لا توجد مشاريع."); download("devnote_backup.json",JSON.stringify(notes,null,2),"application/json"); }
function exportAll(){ if(!notes.length) return alert("لا توجد مشاريع."); download("devnote_all.txt",notes.map(n=>`===== ${n.title} =====\n${n.code}`).join("\n\n"),"text/plain"); }
function importJSON(e){
  const f=e.target.files?.[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const x=JSON.parse(String(r.result));
      if(!Array.isArray(x)) throw new Error("صيغة غير صحيحة");
      const rows=x.map(n=>({
        user_id:user.id, title:String(n.title??"بدون عنوان"),
        description:String(n.description??n.desc??""), type:String(n.type??"Other"),
        code:String(n.code??""),
        tags:Array.isArray(n.tags)?n.tags:String(n.tags??"").split(",").map(t=>t.trim()).filter(Boolean),
        favorite:!!n.favorite, pinned:!!n.pinned, versions:Array.isArray(n.versions)?n.versions:[]
      }));
      const {error}=await supabase.from("projects").insert(rows);
      if(error) throw new Error(error.message);
      await loadNotes(); toast("تم الاستيراد 📥");
    }catch(err){ alert("خطأ: "+err.message); }
    e.target.value="";
  };
  r.readAsText(f);
}

/* ---------------- الربط ---------------- */
$("type").innerHTML=TYPES.map(t=>`<option>${t}</option>`).join("");
$("saveBtn").onclick=saveCode;
$("search").oninput=renderList;
$("themeBtn").onclick=toggleTheme;
$("backBtn").onclick=()=>{activeId=null;isEditing=false;renderList();renderMain();};
$("editBtn").onclick=toggleEdit;
$("copyBtn").onclick=copyCode;
$("shareBtn").onclick=shareCode;
$("fontUp").onclick=()=>changeFont(1);
$("fontDown").onclick=()=>changeFont(-1);
$("wrapBtn").onclick=()=>{wrapOn=!wrapOn;$("wrapBtn").textContent="↔️ التفاف: "+(wrapOn?"ON":"OFF");renderMain();};
$("fsBtn").onclick=()=>{ document.fullscreenElement?document.exitFullscreen():$("codeWrap").requestFullscreen?.(); };
$("previewBtn").onclick=runPreview;
$("versionsBtn").onclick=openVersions;
$("settingsBtn").onclick=openSettings;
$("expJson").onclick=exportJSON;
$("expAll").onclick=exportAll;
$("impBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=importJSON;
$("menuBtn").onclick=()=>$("sidebar").scrollIntoView({behavior:"smooth"});

/* Command Palette — Ctrl+K */
const COMMANDS=[
  ["➕ مشروع جديد",()=>{closeModal();$("title").focus();}],
  ["⭐ المفضلة",()=>{closeModal();filter="fav";renderList();}],
  ["📌 المثبتة",()=>{closeModal();filter="pin";renderList();}],
  ["📤 تصدير JSON",()=>{closeModal();exportJSON();}],
  ["📥 استيراد",()=>{closeModal();$("fileInput").click();}],
  ["🌙 تغيير الثيم",()=>{closeModal();toggleTheme();}],
  ["⚙️ الإعدادات",()=>openSettings()],
  ["🚪 تسجيل الخروج",()=>{closeModal();supabase.auth.signOut();}]
];
function openPalette(q=""){
  openModal(`<h2>⌘ Command Palette</h2><input id="pq" placeholder="اكتب أمرًا..." value="${esc(q)}"/><div id="plist"></div>`);
  const draw=()=>{
    const v=$("pq").value.toLowerCase();
    $("plist").innerHTML=COMMANDS.filter(([l])=>l.toLowerCase().includes(v)).map(([l],i)=>`<div class="palette-item" data-i="${COMMANDS.findIndex(c=>c[0]===l)}">${l}</div>`).join("");
    $("plist").querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>COMMANDS[+el.dataset.i][1]());
  };
  $("pq").oninput=draw; draw(); $("pq").focus();
}
document.addEventListener("keydown",(e)=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openPalette(); }
  if(e.key==="Escape") closeModal();
});

applyPrefs();
</script>
